<style>
@import url('https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400&display=swap');
:root{ --bg:#f5f3ff; --panel:#ffffff; --text:#4c1d95; --muted:#a78bfa; --primary:#7c3aed; --primary2:#a78bfa; --border:color-mix(in srgb, var(--text) 18%, transparent); --option-bg:color-mix(in srgb, var(--panel) 88%, var(--primary) 12%); --option-hover:color-mix(in srgb, var(--panel) 80%, var(--primary) 20%); --option-active:color-mix(in srgb, var(--panel) 72%, var(--primary) 28%); --radius:16px; --app-font:'Scheherazade New', Scheherazade, serif; }
body{ margin:0; font-family:var(--app-font); background:var(--bg); color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:20px; box-sizing:border-box; }
button,input,table,th,td,label,h1,h2,h3,p,div{ font-family:var(--app-font); }
.card{ background:var(--panel); width:100%; max-width:600px; border-radius:var(--radius); padding:24px; box-shadow:0 10px 30px rgba(0,0,0,0.3); border:1px solid var(--border); }
h1{ margin:0 0 10px; font-size:22px; text-align:center; } .desc{ color:var(--muted); font-size:13px; margin-bottom:20px; text-align:center; line-height:1.5; }
.quizLogoWrap{ width:162px; height:162px; border-radius:50%; overflow:hidden; margin:4px auto 18px; border:1px solid var(--border); background:rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; }
.quizLogo{ width:100%; height:100%; object-fit:cover; display:block; }
.loginIntro{ text-align:center; }
.loginForm{ width:100%; max-width:420px; margin:0 auto; }
.loginForm label{ text-align:left; }
.loginForm input{ text-align:left; }
.reviewBox{ margin-top:20px; border-top:1px solid var(--border); padding-top:18px; }
.reviewItem{ border:1px solid var(--border); border-radius:12px; padding:14px; margin-top:12px; background:color-mix(in srgb, var(--panel) 90%, var(--primary) 10%); }
.badge{ display:inline-block; padding:4px 8px; border-radius:999px; font-size:11px; font-weight:800; margin-bottom:8px; }
.badge.ok{ background:rgba(34,197,94,.16); color:var(--primary2); }
.badge.no{ background:rgba(239,68,68,.16); color:#ef4444; }
.reviewMeta{ font-size:13px; line-height:1.55; color:var(--text); }
.reviewMeta b{ color:var(--muted); }
label{ font-size:10px; text-transform:uppercase; font-weight:bold; color:var(--muted); margin-bottom:4px; display:block; }
.loginForm label{ font-size:12px; }
.loginForm input{ padding:10px 12px; }
input{ width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:color-mix(in srgb, var(--panel) 92%, var(--text) 8%); color:var(--text); margin-bottom:15px; box-sizing:border-box; outline:none; }
.loginForm input{ padding:10px 12px; }
.timerBox{ width:max-content; min-width:118px; margin:0 auto 14px; padding:8px 16px; border-radius:999px; background:linear-gradient(135deg, color-mix(in srgb, var(--primary) 18%, var(--panel) 82%), color-mix(in srgb, var(--primary2) 16%, var(--panel) 84%)); border:1px solid color-mix(in srgb, var(--primary) 42%, var(--border)); color:var(--primary2); font-size:17px; font-weight:800; letter-spacing:.04em; text-align:center; box-shadow:0 8px 22px rgba(0,0,0,.16); }
.timeEndNotice{ margin:0 0 16px; padding:12px 14px; border-radius:14px; background:color-mix(in srgb, #ef4444 12%, var(--panel) 88%); border:1px solid color-mix(in srgb, #ef4444 46%, var(--border)); color:var(--text); text-align:center; font-size:15px; font-weight:800; }
.btn{ background:var(--primary); color:#fff; border:none; padding:12px 20px; border-radius:10px; cursor:pointer; font-weight:800; width:100%; transition:0.2s; box-shadow:0 8px 18px rgba(0,0,0,.22); }
.btn:hover{ filter:brightness(1.1); }
.btn-back{ background:linear-gradient(135deg, var(--primary), var(--primary2)); color:#fff; border:1px solid rgba(255,255,255,.35); box-shadow:0 0 0 3px rgba(255,255,255,.10), 0 8px 22px rgba(0,0,0,.25); }
.btn-back:hover{ filter:brightness(1.18); box-shadow:0 0 0 4px rgba(255,255,255,.14), 0 10px 26px rgba(0,0,0,.30); }
.opt{ display:block; padding:14px; border:1px solid color-mix(in srgb, var(--primary) 35%, var(--border)); border-radius:10px; margin-bottom:10px; cursor:pointer; transition:0.2s; background:var(--option-bg); color:var(--text); font-weight:600; }
.opt:hover{ background:var(--option-hover); border-color:color-mix(in srgb, var(--primary) 55%, var(--border)); } .opt.active{ border-color:var(--primary); background:var(--option-active); box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 24%, transparent); }
.bar{ height:6px; background:rgba(255,255,255,0.05); border-radius:3px; margin-bottom:20px; overflow:hidden; }
.fill{ height:100%; background:var(--primary); transition:width 0.3s; }
table{ width:100%; border-collapse:collapse; margin-top:15px; font-size:12px; }
th, td{ text-align:left; padding:8px; border-bottom:1px solid var(--border); }
@media (min-width: 901px){ body{ overflow:hidden; } .card{ max-height:calc(100vh - 40px); overflow:auto; } }

<script>
const DATA = {"title":"KUIZ RC3221","desc":"أجب عن جميع الأسئلة","lang":"ar","randQ":true,"randA":true,"saveData":true,"classLbl":"NO MATRIK","sheetUrl":"https://script.google.com/macros/s/AKfycbwgKImUI7s_YugLtGJXbplz8vJxuVMl1cvkieWJjNyWhDtw-yifMkcoZFinJO8zaqN--A/exec","logoUrl":"","timerMinutes":0,"hasExplanation":true,"questions":[{"q":"ماذا يفضل سالم من الطعام في حوار المطعم؟","choices":["البيض والأرز المقلي","الدجاج المقلي والبطاطس","اللحم والسلطة","السمك المشوي والأرز"],"answerIndex":3,"explain":"تذكر الوجبة البحرية التي طلبها سالم عند المضيف.","rationales":["هذا الخيار لم يذكره سالم كوجبة مفضلة لديه في حوار المطعم.","الدجاج المقلي والبطاطس هو خيار زبير في الحوار وليس سالم.","اللحم والسلطة هما ما ت فضله هند في حوار دعوة العشاء مع سلمى.","فضل سالم تناول السمك المشوي مع الأرز عندما سأله المضيف في المطعم."]},{"q":"كم كان المبلغ المطلوب كاملاً للوجبة التي طلبها سالم وزبير في المطعم؟","choices":["مئتا ألف روبية","خمسون ألف روبية","عشرون ألف روبية","مئة ألف روبية"],"answerIndex":3,"explain":"يرتبط المبلغ بالعدد (مئة) والعملة الرسمية المذكورة.","rationales":["هذا المبلغ يتجاوز السعر المحدد في الحوار وهو مئة ألف روبية.","هذا المبلغ أقل من القيمة الإجمالية المعلنة في الحوار.","هذا ليس المبلغ الذي طلبه المضيف مقابل الوجبتين والمشروبات.","ذكر المضيف أن المطلوب إجمالاً للوجبة هو مئة ألف روبية."]},{"q":"لماذا لم يستطع سالم دفع ثمن الطعام في المطعم؟","choices":["لأن المبلغ كان كبيراً جداً ولم يكفِ ما معه","لأنه ترك محفظته في المكتب","لأنه ضيع نقوده أثناء الطريق إلى المطعم","لأن المطعم لا يقبل إلا الدفع الإلكتروني"],"answerIndex":1,"explain":"فكر في المكان الذي نسي فيه سالم أمتعته الشخصية.","rationales":["سالم لم يشتكِ من غلاء السعر بل اكتشف غياب محفظته بالكامل.","اعتذر سالم لرفيقه زبير لأنه نسي محفظته على المكتب.","حدد سالم مكان وجود المحفظة بأنه تركها في المكتب ولم يضعها في الطريق.","لم يُذكر في النص أي شرط يتعلق بالدفع الإلكتروني."]},{"q":"ما الشراب الذي اختاره زبير بعد أن خيره المضيف بين عصير البرتقال وعصير المنجو؟","choices":["عصير البرتقال","القهوة","عصير المنجو","الشاي"],"answerIndex":0,"explain":"استحضر العصير الفاكهي الحمضي الذي طلبه زبير من المضيف.","rationales":["اختار زبير عصير البرتقال قائلاً: 'عصير البرتقال من فضلك'.","القهوة هي المشروب الذي يفضله سالم وليس زبير.","طرح المضيف عصير المنجو كخيار ثاني، لكن زبير فضل البرتقال.","الشاي هو المشروب الذي اختارته هند في الحوار الثاني."]},{"q":"ما الموقف الذي أظهره زبير عندما اكتشف سالم أنه نسي محفظته؟","choices":["اقترح رهن شيء من أمتعتهما للمطعم","طلب من سالم الذهاب فوراً لإحضار المحفظة","طلب خصماً من المضيف لتغطية النقص","تكفل بدفع الحساب كاملاً عن صديقه"],"answerIndex":3,"explain":"تذكر عبارة 'دعْه على حسابي'.","rationales":["لم يقترح زبير الرهن بل دفع المبلغ المطلوب مباشرة.","لم يطلب زبير من سالم العودة بل حل المشكلة بمبادرة منه.","لم يفاوض زبير المضيف على السعر بل دفع الحساب كاملاً.","قال زبير فوراً: 'دعْه على حسابي'، مما ينم عن الكرم والأخوة."]},{"q":"ماذا تفضل هند أن تأكل عندما دعتها سلمى لتناول العشاء؟","choices":["الخبز والجبن","الدجاج المقلي والبطاطس","اللحم والسلطة","السمك المشوي والأرز"],"answerIndex":2,"explain":"تجمع وجبتها بين البروتين الحيواني والأطباق الخضراء الخفيفة.","rationales":["لم تذكر هند الخبز والجبن كوجبة رئيسية مفضلة لليلة العشاء.","هذه الوجبة هي خيار زبير في المطعم وليس هند.","أجابت هند سلمى بأنها تحب أن تأكل اللحم والسلطة.","السمك المشوي هو الخيار المفصل لسالم."]},{"q":"ما الفواكه التي وعدت هند بإحضارها معها إلى بيت سلمى؟","choices":["الموز والتفاح والعنب","الأناناس والجوافة والأفوكادو","المنجو والبرتقال والبطيخ","العنب والشمام والبرتقال"],"answerIndex":0,"explain":"تتكون القائمة من ثلاث فواكه شهرية منها ثمرة تطول وأخرى مدورة وثالثة في عناقيد.","rationales":["قالت هند في ختام الحوار: 'سأحضر الموز والتفاح والعنب'.","هذه الفواكه ظهرت في لوحة المفردات المصورة فقط ولم تذكرها هند.","هذه المجموعة تحتوي على فواكه لم تُذكر في وعود هند لسلمى.","رغم ذكر العنب، إلا أن الشمام والبرتقال ليسا ضمن الفواكه الثلاث التي وعدت بها هند."]},{"q":"ما المشروب المفضل لكل من سالم وهند على التوالي وفق الحوارين؟","choices":["سالم يفضل القهوة وهند تفضل الشاي","سالم يفضل الشاي وهند تفضل القهوة","سالم يفضل عصير البرتقال وهند تفضل القهوة","سالم يفضل القهوة وهند تفضل عصير المنجو"],"answerIndex":0,"explain":"أحدهما يفضل مشروباً منشطاً أسمر والأخرى تفضل المشروب الساخن الأحمر.","rationales":["صرح سالم بـ'أحب أن أشرب القهوة' وقالت هند 'أحب أن أشرب الشاي'.","هذا يعكس المشروبين المفضلين بين الشخصيتين.","زبير هو من اختار عصير البرتقال وليس سالم.","هند فضلت الشاي على العصائر المشروبة."]},{"q":"في نمط الاستبدال: (أفضل الدجاج والأرز للعشاء)، ما الصياغة الصحيحة عند استخدام العناصر (السمك المشوي - البطاطس - الغداء)؟","choices":["أفضل السمك المشوي والأرز للفطور","أفضل الدجاج والبطاطس للغداء","أفضل السمك المشوي والبطاطس للغداء","أفضل البطاطس والسمك المشوي للعشاء"],"answerIndex":2,"explain":"ضع كل عنصر في موضعه التركيبي المطابق للنموذج الأصلي.","rationales":["تم وضع كلمة 'الفطور' بدلاً من العنصر المحدد 'الغداء'.","لم تُستبدل كلمة 'الدجاج' بـ 'السمك المشوي'.","يستبدل العناصر بالترتيب الصحيح ليعطي الجملة السليمة تركيباً ومعنى.","احتفظت الجملة بكلمة 'العشاء' بدلاً من التبديل إلى 'الغداء'."]},{"q":"بناءً على الحوار الثاني، ما الظرف الذي أتاح لسلمى دعوة هند لبيتها؟","choices":["لأن هند كانت مريضة وتحتاج إلى الرعاية","لأن هند لم تكن مشغولة في تلك الليلة","بمناسبة عودة سلمى من السفر","بسبب إغلاق جميع المطاعم في المدينة"],"answerIndex":1,"explain":"تذكر السؤال الأول الذي طرحته سلمى عن حالة هند في هذه الليلة.","rationales":["لم يُذكر في الحوار أي حالة مرضية لهند.","تأكدت سلمى أولاً بسؤالها 'هل أنت مشغولة هذه الليلة؟' فأجابت هند 'لا، لست مشغولة'.","لم تتطرق المحادثة إلى موضوع السفر إطلاقاً.","السبب هو فراغ هند وتفرغها للمقابلة وليس إغلاق المطاعم."]},{"q":"ما شكل السبورة كما أجمع الطلاب في حوار الدرس الثاني؟","choices":["مثلث","مستدير","مستطيل","مربع"],"answerIndex":2,"explain":"شكل هندسي له أربعة أضلاع، كل ضلعين متقابلين متساويان.","rationales":["المثلث هو الشكل الذي رسمه المدرس على السبورة لاحقاً.","المستدير هو شكل الإطار والقمر وفق الحوار والتدريبات.","أجاب الطلاب المدرس بأن شكل السبورة 'مستطيل'.","المربع هو شكل الصندوق المذكور في الدرس."]},{"q":"ما الشكل الهندسي المنسوب للبيض في الحوار ونص المطبخ؟","choices":["بيضوي","كروي","مكعب","أسطواني"],"answerIndex":0,"explain":"اسم هذا الشكل مشتق مباشر من كلمة 'بيض'.","rationales":["تطابق اسم الشكل 'بيضوي' مع طبيعة شكل البيض في النصين.","الشكل الكروي نُسب للطماطم في النص وليس للبيض.","الشكل المكعب وصف به الفرن في نص المطبخ.","الوصف الأسطواني خُصص للأكواب في مطبخ المطعم."]},{"q":"في نص 'في المطبخ'، كيف وُصفت الأكواب والفرن على التوالي؟","choices":["الأكواب مستديرة والفرن هرمي","الأكواب أسطوانية والفرن مكعب","الأكواب بيضوية والفرن منشور","الأكواب كروية والفرن مستطيل"],"answerIndex":1,"explain":"الأول يبدو كأنبوب مجوف والثاني مجسم ستة أوجه مربعة.","rationales":["الوصف الهرمي أُطلق على الجبن وليس الفرن.","ورد في النص أن 'الأكواب أسطوانية' وأن الفرن 'مكعب'.","لم يوصف الفرن بأنه منشور في متن القطعة.","هذا الترتيب ينتهك الأوصاف الهندسي المحددة بالنص."]},{"q":"ما الشكل الهندسي لكل من الجبن والطماطم كما ورد في نص 'في المطبخ'؟","choices":["الجبن مربع والطماطم أسطواني","الجبن مثلث والطماطم مستدير","الجبن هرمي والطماطم كروي","الجبن مكعب والطماطم بيضوي"],"answerIndex":2,"explain":"الأول يشبه الأهرامات والثاني يشبه الكرة.","rationales":["هذا التوصيف يخالف الأوصاف المجسمة المذكورة للأطعمة.","العبارة تستخدم أشكالاً ثنائية الأبعاد بدلاً من المجسمات الثلاثية الواردة في النص.","نصت القطعة على: 'الجبن فهو هرمي، وأما الطماطم فكروي'.","المكعب هو الفرن والبيضوي هو البيض."]},{"q":"أي من العبارات التالية تصف المائدة والصحون في مطبخ المطعم وصفاً صحيحاً وفق النص؟","choices":["المائدة كروية والصحون أسطوانية","المائدة مستطيلة والصحون مربعة","المائدة مثلثية والصحون بيضوية","المائدة مربعة والصحون مستديرة"],"answerIndex":3,"explain":"المائدة أبعادها متساوية كالصندوق، والأطباق مدورة.","rationales":["هذه الأوصاف استخدمت لأغراض وأطعمة أخرى في النص.","هذا عكس للأوصاف الصريحة المذكورة في النص.","الأطباق هي التي وُصفت بالثلثية وليس المائدة.","جاء في القطعة: 'مائدة مربعة... والصحون مستديرة'."]},{"q":"ما الشكل الهندسي الذي يُشبه به الجبل عادة كما في التدريب الأول للدرس الثاني؟","choices":["مستدير","مثلث","مربع","مستطيل"],"answerIndex":1,"explain":"يتخذ الجبل شكلاً ذا قمة بزاوية وأضلاع مائلة.","rationales":["المستدير يمثل القمر أو الصحن وليس الجبل.","استُخدم عنصر 'الجبل' لتمثيل الشكل 'المثلث' في تدريبات الدرس.","المربع يمثل الصندوق وليس الجبل.","المستطيل يمثل المكتب أو السبورة."]},{"q":"ما اسم الشكل الذي يتكون من ستة أضلاع كما في لوحة مفردات الأشكال؟","choices":["متوازي الأضلاع","مخمس","سداسي الأضلاع","شبه المنحرف"],"answerIndex":2,"explain":"يشتق اسمه المباشر من الرقم ستة.","rationales":["متوازي الأضلاع هو مضلع رباعي وليس سداسياً.","المخمس يحتوي على 5 أضلاع وليس 6.","يُسمى المضلع المستوي الذي يمتلك 6 أضلاع بـ'سداسي الأضلاع'.","شبه المنحرف مضلع رباعي فيه ضلعان متوازيان فقط."]},{"q":"أي الأشكال التالية يُعد مجسماً ثلاثي الأبعاد وله أوجه مربعة متطابقة كشكل الفرن؟","choices":["المخروط","المكعب","المعين","الدائرة"],"answerIndex":1,"explain":"مجسم ثلاثي الأبعاد تشبه أوجُهُه مربعاً.","rationales":["المخروط مجسم قاعدته دائرية وله رأس واحد.","المكعب هو المجسم المكون من ستة أوجه مربعة متطابقة.","المعين مضلع رباعي مستوٍ وليس مجسماً ثلاثي الأبعاد.","الدائرة شكل مستوٍ ثنائي الأبعاد وليست مجسماً."]},{"q":"في جملة 'هذا قمر، وهو مستدير'، ما التعبير المطابق للمذكر والمؤنث عند استبدال القمر بـ 'الساعة'؟","choices":["هذا ساعة، وهي مستديرة","هذه ساعة، وهو مستدير","هذا ساعة، وهو مستدير","هذه ساعة، وهي مستديرة"],"answerIndex":3,"explain":"تحول ضمائر واسم الإشارة والصفة لتقترن بالتاء المربوطة.","rationales":["اسم الإشارة 'هذا' لا يتطابق مع الاسم المؤنث 'ساعة'.","لم يُعدّل الضمير والصفة لتناسب التأنّيث.","احتفظت الجملة بالتذكير رغم أن كلمة 'ساعة' مؤنثة.","تتغير أسماء الإشارة والضمائر والصفات لتناسب التأنيث مع كلمة 'ساعة'."]},{"q":"ما الشكل الهندسي الذي يحتوي على قاعدة دائرية وينتهي برأس واحد مدبب في اللوحة المرفقة؟","choices":["متوازي المستطيلات","منشور","أسطوانة","مخروط"],"answerIndex":3,"explain":"تشبه قبعة أعياد الميلاد أو قمع المرور.","rationales":["متوازي المستطيلات أوجهه مستطيلة الشكل.","المنشور له قاعدتان متطابقتان وأوجه جانبية.","الأسطوانة لها قاعدتان دائريتان متوازيتان ودون رأس مدبب.","المخروط هو المجسم ذو القاعدة الدائرية والطرف المدبب."]},{"q":"أين يسكن معظم الشباب وفق حوار إبراهيم ويوسف في الدرس الثالث؟","choices":["في الحي القديم فقط","في المزارع البعيدة","في القرية","في المدينة"],"answerIndex":3,"explain":"المنطقة ذات الفرص الكثيرة والمصانع المتعددة.","rationales":["انتقل الشباب إلى المدينة بشكل عام وليس لحي قديم بعينه.","المزارع مكان للعمل في القرية وليست الموطن الرئيسي لسكن الشباب.","القرية يسكنها الشيوخ بشكل رئيسي كما جاء في الحوار.","أوضح يوسف في الحوار أن الشباب يسكنون في المدينة بحثاً عن العمل."]},{"q":"ما السبب الرئيسي لانتقال الشباب للعيش في المدينة بدلاً من القرية حسب الحوار؟","choices":["لأن وسائل النقل غير موجودة في القرية","لأنهم يحبون الضوضاء والازدحام","لأن فرصة العمل في القرية نادرة ومتوفرة في المدينة","لأن البيوت في القرية ضيقة للغاية"],"answerIndex":2,"explain":"يتعلق الأمر بكسب العيش والوظائف والمصانع.","rationales":["السبب المباشر والمنصوص عليه هو فرص العمل والوظائف.","الدافع هو الاقتصاد والعمل وليس حب الضوضاء.","ذكر يوسف بوضوح أن 'فرصة العمل فيها (القرية) نادرة'.","وصف يوسف المزارع بالواسعة والبيوت بالقليلة ولم يذكر ضيقها."]},{"q":"ما النشاط الاقتصادي والعمل الأساسي الذي يمارسه معظم أهل القرية؟","choices":["الصناعة الثقيلة","الصيد البحري","التجارة العالمية","الزراعة"],"answerIndex":3,"explain":"عمل يرتبط بالأرض والمزارع والنباتات.","rationales":["المصانع تتواجد في المدينة وليس القرية.","لم يُذكر الصيد البحري كمهنة لأهل القرية في هذا النص.","المدينة هي التي تُعد مركزاً للتجارة والثقافة.","ذكر النص أن القرية مركز للزراعة وأن معظم أهلها يشتغلون بها."]},{"q":"ما الميزة الطبيعية التي تتمتع بها القرية وتجعل بعض الناس يفضلون العيش فيها؟","choices":["كثرة المجمعات التجارية والأسواق الضخمة","أنها هادئة وهواؤها نقي","انتشار الجامعات والمكتبات الحديثة","تعدد وسائل المواصلات السريعة"],"answerIndex":1,"explain":"تتصف بغياب الضوضاء ونقاء الجو.","rationales":["الأسواق في القرية قليلة وصغيرة وفق القطعة.","ورد في النص: 'يفضل بعض الناس الحياة في القرية لأنها هادئة والهواء فيها نقي'.","الجامعات والمكتبات من المظاهر الترفيهية والتعليمية للمدينة.","تعدد المواصلات من خصائص المدينة التي تسبب الزحام."]},{"q":"أي من الترتيبات التالية يربط المفرد بجمعه الصحيح وفق جدول الدرس الثالث؟","choices":["الشيخ: الشيوخ | المزرعة: المزارع | المصنع: المصانع","الشيخ: الشباب | المزرعة: البيوت | المصنع: المصانع","الشيخ: الشيوخ | المزرعة: المصانع | المصنع: المزارع","الشيخ: الشبان | المزرعة: المزارعون | المصنع: الصُنّاع"],"answerIndex":0,"explain":"طابق كل كلمة مع جمع التكسير المناسب لها في القائمة.","rationales":["هذه هي الجموع الصحيحة للمفردات المذكورة في التمارين.","جمع كلمة 'الشيخ' ليس 'الشباب' ولا 'المزرعة' تجمع على 'البيوت'.","تم تبديل جموع المصنع والمزرعة بشكل خاطئ.","استُخدمت جموع غير الواردة في التدريب المخصص للمفرد والجمع."]},{"q":"تُعد المدينة بناءً على النص القارئ مركزاً رئيساً لـ:","choices":["الهدوء والسكينة","الأنشطة التقليدية البدائية","الزراعة والرعي","التجارة والثقافة"],"answerIndex":3,"explain":"تتعلق بالتبادل الاقتصادي والعلم والمعرفة.","rationales":["الهدوء والسكينة من خصائص القرية وليست المدينة المزدحمة.","الحياة التقليدية تخص القرية بينما تتميز المدينة بالحداثة.","القرية هي المركز المخصص للزراعة.","جاء نصاً في القطعة: 'تكون المدينة مركزاً للتجارة والثقافة'."]},{"q":"ما العيب الرئيسي الناجم عن تعدد وسائل المواصلات في المدينة بحسب القطعة؟","choices":["أنها تؤدي إلى بطء حركة التجارة","أنها تجعل السكان يهاجرون للريف","أنها قد تسبب زحاماً وتلوثاً","أنها تمنع إنشاء المدارس والجامعات"],"answerIndex":2,"explain":"نتيجتان سلبيتان تؤثران على حركة السير وجودة الهواء.","rationales":["المواصلات تخدم التجارة وتنشطها وليست سبباً في بطئها.","الهجرة للريف سببها البحث عن الهدوء وليس المواصلات بذاتها.","صرح النص بأن المواصلات في المدينة 'قد تسبب زحاماً وتلوثاً'.","المدينة مليئة بالمدارس والجامعات المكتظة."]},{"q":"وفق التدريب الرابع (صح أو خطأ)، أي العبارات التالية تعتبر خاطئة (خ)؟","choices":["الحياة في القرية هادئة","القرية أكبر من المدينة","القرية مركز للزراعة","عدد سكان المدينة كثير"],"answerIndex":1,"explain":"فكر في المساحة والحجم بين القرية والمدينة أيُّهما الأصغر.","rationales":["عبارة صحيحة تماماً وتوافق النص القرائي.","هذه العبارة خاطئة لأن القطعة ذكرت أن المدينة منطقة أكبر والقرية أصغر.","عبارة صحيحة تطابق واقع القطعة.","عبارة صحيحة وفق النص حيث يسكنها عدد كبير من الناس."]},{"q":"ما الجملة المطابقة لنمط الاستبدال: (يشتقل الناس بأعمالهم ليلاً ونهاراً) عند تعويض الفعل والفاعل بـ (الطلاب - دروس)؟","choices":["يشتقل الطلاب بأعمالهم ليلاً ونهاراً","يشتقل الناس بدروسهم ليلاً ونهاراً","يشتقل الطلاب بدروسهم ليلاً ونهاراً","يقرأ الطلاب دروسهم في المدرسة"],"answerIndex":2,"explain":"حافظ على الفعل والظرف وغير الفاعل والمجرور بالترتيب.","rationales":["لم يتم استبدال الكلمة الثانية 'أعمالهم' بـ 'دروسهم'.","لم يُغير الفاعل 'الناس' إلى 'الطلاب'.","تم استبدال 'الناس' بـ'الطلاب' و'أعمالهم' بـ'دروسهم' بشكل صحيح لغوياً.","تغيرت صيغة الفعل والجملة بالكامل وعُدلت عن النموذج المطلوب."]},{"q":"كيف تبدو المدارس والأسواق في القرية مقارنة بالمدينة وفق النص؟","choices":["لا توجد مدارس أو أسواق مطلقاً","المدارس متعددة والأسواق عالمية","المدارس صغيرة والأسواق قليلة","المدارس حديثة والأسواق ضخمة"],"answerIndex":2,"explain":"تتسم مؤسسات القرية بالصغر والمحدودية.","rationales":["النص أثبت وجودها لكن بصفة الصغر والقِلة.","هذا الوصف يناقض طبيعة القرية البسيطة.","نصت القطعة على وجود 'مدارس صغيرة' وأن 'الأسواق تكون قليلة'.","المدارس الحديثة والأسواق الضخمة توجد في المدينة."]},{"q":"إلى أين اتفقت الأسرة على الذهاب في نهاية الأسبوع في حوار الدرس الرابع؟","choices":["إلى السوق التجاري","إلى الشاطئ","إلى المتحف","إلى المزرعة"],"answerIndex":2,"explain":"مكان ثقافي تُعرض فيه الآثار والمعروضات التاريخية.","rationales":["الأب هو من ذهب لشراء الفواكه والخضار من السوق بشكل منفرد وليس النزهة الجماعية.","لم يُذكر الشاطئ كوجهة للأسرة في الحوار.","قال الأبناء رداً على سؤال الأم: 'سنذهب إلى المتحف إن شاء الله'.","المزرعة لم تكن الخيار المخطط له في نهاية الأسبوع."]},{"q":"ما المهمة المنزلية التي كُلّف بها محمود لمساعدة الأسرة؟","choices":["غسل الأطباق والصحون والأكواب","ترتيب المائدة","كوي الملابس","كنس البلاط"],"answerIndex":0,"explain":"تختص مهمته بتنظيف أدوات الطعام والشراب بالماء والصابون.","rationales":["قال محمود: 'وأنا أغسل الأطباق والصحون والأكواب'.","أحمد هو من تطوع لترتيب المائدة.","حامدة هي من قامت بكوي الملابس.","حامد هو من تولى كنس البلاط."]},{"q":"من الابن الذي تولى مهمة كنس البلاط في المطبخ/البيت؟","choices":["أحمد","حامد","يوسف","محمود"],"answerIndex":1,"explain":"يقوم باستخدام المكنسة لإزالة الأتربة عن الأرضية.","rationales":["أحمد تكفل بترتيب المائدة.","أجاب حامد فوراً رداً على أمه: 'سأكنس البلاط'.","يوسف شخصية من الدرس الثالث وليس من أبناء هذه الأسرة.","محمود تولى غسل الأواني."]},{"q":"ما العمل الذي قامت به حامدة للمشاركة في تجهيزات البيت؟","choices":["طبخ طعام الغداء","شراء الفواكه","كوي الملابس","ترتيب السرير"],"answerIndex":2,"explain":"تستخدم المكواة لإزالة التجاعيد عن الثياب.","rationales":["الأم هي من قامت بطبخ طعام الغداء.","الأب هو من ذهب لشراء الفواكه والخضار.","طلبت منها الأم كوي الملابس فقالت: 'لبيك وسعديك يا والدتي'.","ترتيب السرير عمل يقوم به حامد قبل النوم في النص الثاني."]},{"q":"كيف شارك الأب في إعداد ومتطلبات المنزل في نهاية الأسبوع؟","choices":["ذهابُه لشراء الخضروات والفواكه","تنظيف أرضيات الغرف","إعداد طعام الغداء بنفسه","غسيل الملابس في الغسالة"],"answerIndex":0,"explain":"تتعلق مهمته بالخروج إلى السوق وجلب الأطعمة الطازجة.","rationales":["طلب منه الأم شراء الخضروات والفواكه فوافق قائلًا: 'حسناً.. سأذهب حالاً'.","حامد هو من كنس الأرضية والبلاط.","الأم هي من تكفلت بطبخ الغداء.","الأم اقترحت غسل الملابس على محمد وليس الأب."]},{"q":"ماذا يفعل حامد لأسنانه قبل أن ينام وفق نص 'حان وقت النوم'؟","choices":["يفحصها عند الطبيب","يمضمضها بالشراب فقط","يمتنع عن غسلها ليلاً","ينظفها"],"answerIndex":3,"explain":"سلوك صحي متبع باستخدام الفرشاة والمعجون للحفاظ على الفم.","rationales":["زيارة الطبيب لم تذكر ضمن الروتين اليومي قبل النوم مباشرة.","النص ذكر لفظ التنظيف الشامل للأسنان بعد الوضوء.","هذا يناقض حرص حامد على نظافته الشخصية كما ورد في النص.","ذكر النص أن حامد 'ينظف أسنانه' ضمن تحضيراته للنوم."]},{"q":"ما العبادة أو العمل الذي يقوم به حامد فور جلوسه على السرير وقبل النوم مباشرة؟","choices":["يتناول وجبة العشاء","يراجع دروس الغد كاملة","يرفع يديه ويدعو ربه","يشاهد التلفاز"],"answerIndex":2,"explain":"سنة نبوية تتضمن رفع الكفين والتضرع إلى الله.","rationales":["لم يُذكر أنه يتناول العشاء وهو على السرير.","تهيئة الكراسة للدراسة تتم قبل جلوسه على السرير للنوم.","جاء في النص: 'يرفع يديه يدعو ربه ثم ينام'.","النص لم يذكر مشاهدة التلفاز إطلاقاً ضمن روتينه."]},{"q":"متى يستيقظ حامد من نومه لصلاة التهجد وقيام الليل؟","choices":["في وقت الظهيرة","قبل غروب الشمس مباشرة","في منتصف الليل","عند شروق الشمس"],"answerIndex":2,"explain":"الوقت المنتصف بين بداية الليل ونهايته.","rationales":["الظهيرة منتصف النهار وليست وقتاً لصلاة الليل.","هذا الوقت هو أواخر النهار وليس وقت التهجد والنوم.","نصت القطعة على: 'وفوق منتصف الليل، يستيقظ حامد من نومه لقيام الليل'.","قيام الليل والتهجد يكونان ليلاً قبل طلوع الفجر والشمس."]},{"q":"ما الترتيب الصحيح للأفعال التي يقوم بها حامد قبل النوم بحسب القطعة؟","choices":["ينام فوراً، ثم يستيقظ ليطفئ المصباح ويتوضأ","يدعو ربه، ثم يتوضأ، ثم يشغل المصباح وينام","يشغل المكيف، يخرج من الغرفة، ينظف أسنانه ثم ينام في الصالة","يتوضأ وينظف أسنانه، يطفئ المصباح ويشغل المكيف، يدعو ربه ثم ينام"],"answerIndex":3,"explain":"يبدأ الطهارة أولاً، ثم إعداد جو الغرفة، ثم الدعاء والخلود للراحة.","rationales":["الوضوء وإطفاء المصباح يسبقان النوم الأساسي.","الدعاء يكون على السرير بعد إطفاء المصباح وليس قبله.","حامد ينام في حجيرته الخاصة التي جهز سريرها.","هذا هو الترتيب المتسلسل للخطوات كما وردت بدقة في النص."]},{"q":"وفق الحوار الأول في الدرس الرابع، ما الوجبة التي تكفلت الأم بطبخها؟","choices":["وجبة الفطور للصباح","شواء الأسماك للمتحف","طعام الغداء غداً","طعام العشاء لهذه الليلة"],"answerIndex":2,"explain":"الوجبة الرئيسية التي تتناولها الأسرة في منتصف النهار.","rationales":["الوجبة المحددة بالنص هي الغداء وليست الفطور.","لم يُذكر طبخ الأسماك لأخذها للمتحف.","قالت الأم صراحة: 'أما أنا فأطبخ طعام الغداء'.","صرحت الأم بإعداد طعام الغداء لليوم التالي."]}]}; 
const UI = {"name":"الاسم الكامل","class":"NO MATRIK","start":"ابدأ الاختبار","next":"التالي","back":"رجوع","finish":"إنهاء","retake":"إعادة الاختبار","rank":"أفضل 10 نتائج","saving":"جارٍ حفظ البيانات...","result":"النتيجة","q":"س","tableName":"الاسم","tableClass":"NO MATRIK","percent":"%","alertInfo":"يرجى إدخال المعلومات.","alertChoose":"يرجى اختيار إجابة.","review":"مراجعة الإجابات","questionLabel":"السؤال","answerLabel":"الإجابة","explanationLabel":"الشرح","correct":"صحيح","incorrect":"غير صحيح","feedbackCorrect":"الإجابة صحيحة، لا توجد ملاحظات.","feedbackWrong":"الإجابة لا توافق الفكرة الأساسية.","noRefNote":"لم يتم العثور على شرح في ملف الأسئلة المرفوع.","timeEnd":"انتهى الوقت"};
let state = { mode:'login', idx:0, ans:[], name:'', class:'', qs:[], loading:false, ranking:[], endTime:0, remaining:0, timeEnded:false };
let timerInterval = null;
function esc(v){ return String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function formatTime(ms){ const total = Math.max(0, Math.ceil(ms/1000)); const m = Math.floor(total/60); const s = total % 60; return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0'); }
function startTimer(){ if(timerInterval) clearInterval(timerInterval); if(!DATA.timerMinutes) return; state.endTime = Date.now() + DATA.timerMinutes * 60000; timerInterval = setInterval(() => { state.remaining = state.endTime - Date.now(); if(state.remaining <= 0){ clearInterval(timerInterval); timerInterval = null; state.timeEnded = true; finish(); } else if(state.mode === 'quiz') { const el = document.getElementById('timerBox'); if(el) el.textContent = formatTime(state.remaining); } }, 1000); }
function timerHtml(){ return DATA.timerMinutes && state.mode === 'quiz' ? '<div class="timerBox" id="timerBox">' + formatTime(state.endTime - Date.now()) + '</div>' : ''; }
function buildReview(){
  return '<div class="reviewBox"><h3 style="text-align:center; margin:0 0 12px;">' + UI.review + '</h3>' +
    state.qs.map((q,i) => {
      const picked = state.ans[i];
      const ok = picked === q.answerIndex;
      const userAns = picked === null || picked === undefined ? '-' : q.choices[picked];
      const selectedRationale = q.rationales && picked !== null && picked !== undefined ? q.rationales[picked] : "";
      const correctRationale = q.rationales ? q.rationales[q.answerIndex] : "";
      const fb = selectedRationale || correctRationale || q.explain || (ok ? UI.feedbackCorrect : UI.feedbackWrong + " " + UI.noRefNote);
      return '<div class="reviewItem">' +
        '<span class="badge ' + (ok ? 'ok' : 'no') + '">' + (ok ? UI.correct : UI.incorrect) + '</span>' +
        '<div class="reviewMeta"><b>' + UI.questionLabel + ':</b> ' + esc(q.q) + '</div>' +
        '<div class="reviewMeta"><b>' + UI.answerLabel + ':</b> ' + esc(userAns) + '</div>' +
        '<div class="reviewMeta"><b>' + UI.explanationLabel + ':</b> ' + esc(fb) + '</div>' +
      '</div>';
    }).join('') + '</div>';
}

function render(){
  const app = document.getElementById('app');
  if(state.mode==='login'){
    const logoHtml = DATA.logoUrl ? '<div class="quizLogoWrap"><img class="quizLogo" src="' + esc(DATA.logoUrl) + '" alt="Logo"></div>' : '';
    app.innerHTML = '<div class="loginIntro">' + logoHtml + '<h1>' + DATA.title + '</h1><p class="desc">' + DATA.desc + '</p></div>' +
      '<div class="loginForm"><label>' + UI.name + '</label><input type="text" id="u_name" value="' + esc(state.name) + '">' +
      '<label>' + UI.class + '</label><input type="text" id="u_class" value="' + esc(state.class) + '">' +
      '<button class="btn" onclick="start()">' + UI.start + '</button></div>';
  } else if(state.mode==='quiz'){
    const q = state.qs[state.idx];
    const backBtn = state.idx > 0 ? '<button class="btn btn-back" style="margin-top:10px;" onclick="back()">' + UI.back + '</button>' : '';
    const finishBtn = state.idx === state.qs.length - 1 ? '<button class="btn" style="margin-top:10px;" onclick="next()">' + UI.finish + '</button>' : '';
    app.innerHTML = timerHtml() + '<div class="bar"><div class="fill" style="width:' + ((state.idx)/state.qs.length)*100 + '%"></div></div>' +
      '<div style="font-size:11px; color:var(--muted); margin-bottom:10px;">' + UI.q + ' ' + (state.idx+1) + ' / ' + state.qs.length + '</div>' +
      '<h2 style="font-size:17px; margin-bottom:20px;">' + q.q + '</h2>' +
      q.choices.map((c,i) => '<div class="opt ' + (state.ans[state.idx]===i?'active':'') + '" onclick="setAns(' + i + ')">' + c + '</div>').join('') +
      finishBtn + backBtn;
  } else if(state.mode==='result'){
    let score = state.ans.reduce((acc, a, i) => acc + (a === state.qs[i].answerIndex ? 1 : 0), 0);
    let pct = Math.round((score/state.qs.length)*100);
    let html = '<h1>' + UI.result + '</h1>' + (state.timeEnded ? '<div class="timeEndNotice">' + UI.timeEnd + '</div>' : '') + '<div style="font-size:48px; font-weight:900; color:var(--primary2);">' + pct + '% (' + score + '/' + state.qs.length + ')</div>';
    html += buildReview();
    if(DATA.saveData){
      html += '<div style="margin-top:20px; border-top:1px solid var(--border); padding-top:20px;"><h3 style="text-align:center;">' + UI.rank + '</h3>';
      if(state.loading) html += '<p>' + UI.saving + '</p>';
      else if(state.ranking.length > 0) {
        html += '<table><tr><th>#</th><th>' + UI.tableName + '</th><th>' + UI.tableClass + '</th><th>' + UI.percent + '</th></tr>' + 
          state.ranking.map((r,i) => '<tr><td>' + (i+1) + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.class) + '</td><td>' + esc(r.percent) + '</td></tr>').join('') + '</table>';
      }
      html += '</div>';
    }
    html += '<button class="btn" style="margin-top:20px;" onclick="location.reload()">' + UI.retake + '</button>';
    app.innerHTML = html;
  }
  if (window.MathJax && window.MathJax.typeset) window.MathJax.typeset();
}
function start(){
  state.name = document.getElementById('u_name').value.trim(); 
  state.class = document.getElementById('u_class').value.trim();
  if(!state.name || !state.class) return alert(UI.alertInfo);
  state.qs = JSON.parse(JSON.stringify(DATA.questions));
  if(DATA.randQ) state.qs.sort(() => Math.random()-0.5);
  if(DATA.randA) state.qs.forEach(q => {
    const originalCorrect = q.choices[q.answerIndex];
    const rationales = Array.isArray(q.rationales) ? q.rationales : [];
    const pairs = q.choices.map((choice, idx) => ({ choice, rationale: rationales[idx] || "" }));
    pairs.sort(() => Math.random()-0.5);
    q.choices = pairs.map(p => p.choice);
    q.rationales = pairs.map(p => p.rationale);
    q.answerIndex = q.choices.indexOf(originalCorrect);
  });
  state.ans = new Array(state.qs.length).fill(null);
  state.timeEnded = false;
  state.mode = 'quiz'; startTimer(); render();
}
function setAns(i){ state.ans[state.idx] = i; if(state.idx < state.qs.length - 1){ state.idx++; } render(); }
function back(){ if(state.idx > 0){ state.idx--; render(); } }
function next(){
  if(state.ans[state.idx]===null) return alert(UI.alertChoose);
  if(state.idx < state.qs.length - 1){ state.idx++; render(); }
  else { finish(); }
}
async function finish(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  state.mode = 'result'; render();
  if(DATA.saveData && DATA.sheetUrl){
    state.loading = true; render();
    let score = state.ans.reduce((acc, a, i) => acc + (a === state.qs[i].answerIndex ? 1 : 0), 0);
    let pct = Math.round((score/state.qs.length)*100);
    try {
      await fetch(DATA.sheetUrl, { method:'POST', body: JSON.stringify({name:state.name, class:state.class, score:score, percent:pct}), mode:'no-cors' });
      setTimeout(async () => {
        try { const res = await fetch(DATA.sheetUrl); state.ranking = await res.json(); render(); } catch(e){}
        state.loading = false; render();
      }, 1500);
    } catch(e){ state.loading = false; render(); }
  }
}
render();
</script>
</body></html>
